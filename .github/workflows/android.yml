name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من المستودع إلى المجلد الرئيسي
    - uses: actions/checkout@v4

    # 2. إعداد بيئة Java 11
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    # 3. منح صلاحية التشغيل لملف gradlew في المجلد الرئيسي
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. بناء المشروع
    - name: Build with Gradle
      run: ./gradlew build
