name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # الخطوة 1: سحب كود المشروع من مستودع GitHub
    - uses: actions/checkout@v4

    # الخطوة 2: إعداد بيئة Java (JDK 11) وتفعيل التخزين المؤقت لـ Gradle
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    # الخطوة 3: إعطاء صلاحية التشغيل لملف gradlew داخل مجلد android
    - name: Grant execute permission for gradlew
      working-directory: ./android # يمكنك تغيير 'android' باسم المجلد الفرعي لديك
      run: chmod +x gradlew

    # الخطوة 4: بناء المشروع باستخدام Gradle من داخل مجلد android
    - name: Build with Gradle
      working-directory: ./android # ضمان تنفيذ أمر البناء في المسار الصحيح
      run: ./gradlew build
